<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Poem Generator</title>
  </head>
  <body>
    <header>
      <h1>Welcome to the AI Poem Generator</h1>

    <main>

          autofocus
          required
          autocomplete="off"

      </form>

      <div>🌙 The Coder’s Quiet Place</div>
    </main>
    <footer>
      This AI project was coded by
      <a href="https://github.com/Apelele05">Apelele Kufa</a> and is
      <a href="https://github.com/Apelele05/Poem-generator" target="_blank">
        open sourced on GitHub</a
      >
      and
      <a href="https://app.netlify.com/projects/ai-poem-generator-2025/deploys"
        >is hosted on Netlify</a
      >
    </footer>

    <script src="src/index.js"></script>
  </body>
</html>
