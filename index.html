<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Welcome to the AI Poem Generator</h1>
      </header>

      <main>
        <form>
          <input
            type="text"
            placeholder="Enter the topic of the Poem"
            autofocus
            required
            autocomplete="off"
            class="instructions"
          />
          <input type="submit" class="submit-button" />
        </form>

        <div class="poem">
          🌙 The Coder’s Quiet Place <br />
          In lines of code we often find, A quiet peace within the mind. A world
          created bit by bit, Where dreams and logic cleanly fit.
        </div>
      </main>
      <footer>
        This AI project was coded by
        <a href="https://github.com/Apelele05">Apelele Kufa</a> and is
        <a href="https://github.com/Apelele05/Poem-generator" target="_blank">
          open sourced on GitHub</a
        >
        and
        <a
          href="https://app.netlify.com/projects/ai-poem-generator-2025/deploys"
          >is hosted on Netlify</a
        >
      </footer>
    </div>

    <script src="src/index.js"></script>
  </body>
</html>
